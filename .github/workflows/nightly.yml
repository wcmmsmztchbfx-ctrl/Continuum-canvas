name: Nightly acceptance

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:nightly
      - run: git diff --exit-code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failures
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
          retention-days: 14
